<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- CSS -->
    <link rel="stylesheet" href="/Iniciar_sesion/style.css">
     <!--Favicon-->
    <link rel="icon" href="/Assets/IMG/Logo.jpeg" type="image/x-icon">
</head>
<body>
    <div class="card">
    <h1><a href="principal.html">Conecta con Bienes Raíces</a></h1>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="hola@conecta.com" />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="••••••••••••••••" />
        <button class="toggle-pwd" onclick="togglePassword()" type="button" aria-label="Mostrar contraseña">
          👁
        </button>
      </div>
    </div>

    <button class="btn-ingresar" type="button">Ingresar</button>

    <p class="register-text">
      ¿No tienes una cuenta? <a href="#">regístrate</a>
    </p>
  </div>
  <!--Script iniciar sesión-->
  <script src="script.js"></script>
    
</body>
</html>
