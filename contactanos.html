<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Bienes Raíces</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/Contactanos/contactanos.css">
    <!-- GLOBAL -->
    <link rel="stylesheet" href="/Assets/global.css">
    <!-- ICONOS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!--Favicon-->
    <link rel="icon" href="/Assets/IMG/Logo.jpeg" type="image/x-icon">
</head>

<body>

<!--Navbar-->
<div id="navbar"></div>

<div class="section-wrapper">

    <div class="top-grid">

      <div class="photo-side">
        <img src="/Contactanos/Contacto.jpg" alt="Contacto con Conecta Bienes Raíces" />
      </div>

      <div class="info-side">
        <h2 class="info-title">Conecta con nosotros</h2>

        <div class="contact-row">
          <div class="contact-icon">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"/>
              <polyline points="12 7 12 12 15 15"/>
            </svg>
          </div>
          <div class="contact-text">
            <strong>Horario de atención</strong>
            <span>Lunes a viernes 8:00 a.m – 5:30 p.m<br>Sábados 8:00 a.m – 1:00 p.m</span>
          </div>
        </div>

        <div class="contact-row">
          <div class="contact-icon">
            <svg viewBox="0 0 24 24">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
          </div>
          <div class="contact-text">
            <strong>WhatsApp</strong>
            <span>+57 310 3989930</span>
          </div>
        </div>

        <div class="contact-row">
          <div class="contact-icon">
            <svg viewBox="0 0 24 24">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>
          <div class="contact-text">
            <strong>Correo</strong>
            <span>info@conectabienesraices.com</span>
          </div>
        </div>
      </div>

    </div>

    <div class="divider"></div>

    <!-- FORM -->
    <div class="form-section">
      <h3 class="form-title">Escríbenos: un paso más cerca de tu propiedad ideal</h3>

      <!-- Mensaje de éxito (oculto por defecto) -->
      <div id="form-exito">
        <i class="fa-solid fa-circle-check"></i>
        ¡Mensaje enviado! Nos comunicaremos contigo pronto.
      </div>

      <div class="fields-row">
        <input id="campo-nombres"   class="form-input" type="text"  placeholder="Nombres">
        <input id="campo-apellidos" class="form-input" type="text"  placeholder="Apellidos">
        <input id="campo-correo"    class="form-input" type="email" placeholder="Correo electrónico">
        <input id="campo-telefono"  class="form-input" type="tel"   placeholder="Teléfono">
      </div>

      <textarea id="campo-mensaje" class="form-textarea" placeholder="Mensaje"></textarea>

      <div class="form-footer">
        <label class="checkbox-label">
          <input type="checkbox" id="campo-terminos" checked />
          He leído y aceptado los términos y condiciones
        </label>
        <button id="btn-enviar" class="submit-btn">Enviar información</button>
      </div>
      <span class="error-msg" id="error-terminos"></span>
    </div>

</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- WHATSAPP FLOTANTE -->
<a href="https://wa.me/+573103989930" target="_blank" class="whatsapp-flotante">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<!-- jQuery (requerido antes de contactanos.js) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!--Script contactanos con validación jQuery-->
<script src="/Contactanos/contactanos.js"></script>
<!--Script global-->
<script src="/Assets/global.js"></script>
<script src="/Assets/carrito.js"></script>

</body>
</html>
